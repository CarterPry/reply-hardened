[package]
name = "reply"
version = "0.1.3"
description = "Local reply tracker for iMessage, WhatsApp and Signal"
authors = ["Sean Robins"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reply_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# SQLCipher (not plain SQLite) because Signal Desktop's database is
# encrypted; vendored together with OpenSSL so the bundle links nothing
# from /opt/homebrew and still reads the plaintext iMessage/WhatsApp
# stores unchanged.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# Unwrapping Signal's database key (Chromium os_crypt: PBKDF2-HMAC-SHA1
# then AES-128-CBC). PBKDF2 itself is hand-rolled in `safestorage` over
# these primitives to keep the dependency surface small.
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
# Devtools are enabled automatically in debug builds; the `devtools`
# feature would also enable them in release, which we don't want.
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
thiserror = "1"
