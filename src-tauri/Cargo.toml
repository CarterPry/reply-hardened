[package]
name = "repli"
version = "0.1.3"
description = "Local iMessage reply tracker"
authors = ["Sean Robins"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "repli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
# Devtools are enabled automatically in debug builds; the `devtools`
# feature would also enable them in release, which we don't want.
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
thiserror = "1"
tauri-plugin-updater = "2"
